name: CI/CD & Store Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Release & Update Store
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STORE_PAT: ${{ secrets.STORE_PAT }}
      APP_ID: yearhum
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Spotless & Unit Tests
        run: ./gradlew spotlessCheck test --stacktrace

      - name: Build Dataset Database
        run: >
          ./gradlew :tools:dataset-builder:run
          --args="--from 1990 --to 2026 --skip-mb
          --out app/src/main/assets/databases/capsules.db"

      - name: Auto-generate Screenshots with Roborazzi
        run: ./gradlew :app:recordRoborazziDebug

      - name: Auto-Commit Generated Screenshots to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate latest screenshots [skip ci]"
          file_pattern: store/screenshots/*.png

      - name: Build Android APKs
        run: ./gradlew assembleDebug assembleRelease -PversionCode=${{ github.run_number }} -PversionName="${{ env.APP_VERSION }}"

      - name: Prepare Local Release Artifacts
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Yearhum-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/Yearhum-release.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/Yearhum-release.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Yearhum v${{ env.APP_VERSION }}
          generate_release_notes: true
          body: |
            Automated build for Yearhum version `${{ env.APP_VERSION }}`.

            ### Downloads

            - **Yearhum-debug.apk**: Debug build.
            - **Yearhum-release.apk**: Release build.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out Public Store Repository
        if: env.STORE_PAT != ''
        uses: actions/checkout@v4
        with:
          repository: zyrridian/apps
          token: ${{ secrets.STORE_PAT }}
          path: storefront-repo

      - name: Set up Node.js for Registry Generator
        if: env.STORE_PAT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy Files and Create Registry Manifest
        if: env.STORE_PAT != ''
        working-directory: storefront-repo
        env:
          RELEASE_URL: https://github.com/zyrridian/yearhum/releases/tag/v${{ env.APP_VERSION }}
        run: |
          mkdir -p "apps/$APP_ID/screenshots"

          cp ../release-assets/Yearhum-release.apk \
            "apps/$APP_ID/app-release.apk"

          if [ -f ../store/icon.png ]; then
            cp ../store/icon.png "apps/$APP_ID/icon.png"
          fi

          if compgen -G "../store/screenshots/*" > /dev/null; then
            cp ../store/screenshots/* "apps/$APP_ID/screenshots/"
          fi

          SCREENSHOTS="$(
            find "apps/$APP_ID/screenshots" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' |
              sort |
              jq -R -s 'split("\n") | map(select(length > 0))'
          )"

          jq -n \
            --arg schema "v1" \
            --arg id "$APP_ID" \
            --arg name "Yearhum" \
            --arg version "$APP_VERSION" \
            --arg description "Explore music, cinema, games, and cultural milestones from 1990 to 2025." \
            --arg category "Entertainment" \
            --arg repository "https://github.com/zyrridian/yearhum" \
            --arg release "$RELEASE_URL" \
            --arg artifact "app-release.apk" \
            --argjson screenshots "$SCREENSHOTS" \
            '{
              schema: $schema,
              id: $id,
              name: $name,
              version: $version,
              description: $description,
              category: $category,
              repository: $repository,
              release: $release,
              featured: true,
              icon: "icon.png",
              artifacts: [
                {
                  platform: "android",
                  type: "apk",
                  filename: $artifact
                }
              ],
              screenshots: $screenshots
            }' > "apps/$APP_ID/manifest.json"

      - name: Generate Normalized Registry
        if: env.STORE_PAT != ''
        working-directory: storefront-repo
        run: |
          REGISTRY_GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node scripts/generate-registry.mjs

      - name: Commit and Push Store Update
        if: env.STORE_PAT != ''
        working-directory: storefront-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "apps/$APP_ID" \
            registry/apps.json

          git commit \
            -m "Auto-release: Yearhum v$APP_VERSION" \
            || echo "No changes to commit"

          git push